# Enable only AFTER /etc/letsencrypt/live/friends-chat/ exists.
server {
    listen 80;
    server_name __SERVER_IP__;
    location /.well-known/acme-challenge/ { root /var/www/friends-chat-acme; }
    location / { return 301 https://__SERVER_IP__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __SERVER_IP__;
    ssl_certificate /etc/letsencrypt/live/friends-chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/friends-chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/friends-chat-web;
    index index.html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    gzip on;
    gzip_types application/javascript application/json text/css application/wasm;
    location = /config.json { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ ^/(_matrix/client|_synapse/client)/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
    location /_matrix/ { return 404; }
    location /_synapse/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
